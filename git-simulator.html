<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Simulator - Flujo Colaborativo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial;
            overflow: hidden;
        }
        .header {
            background: #010409;
            border-bottom: 1px solid #30363d;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 24px; font-weight: 600; margin: 0; }
        .header-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(79, 185, 80, 0.15);
            color: #3fb950;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 600;
        }
        .main-wrapper {
            display: flex;
            height: calc(100vh - 70px);
            gap: 0;
        }
        .sidebar {
            width: 300px;
            background: #010409;
            border-right: 1px solid #30363d;
            overflow-y: auto;
            padding: 20px;
        }
        .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #8b949e;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }
        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(79, 185, 80, 0.1);
            border: 1px solid #3fb950;
            color: #3fb950;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: left;
        }
        .btn-action:hover {
            background: rgba(79, 185, 80, 0.2);
        }
        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-action.danger {
            background: rgba(248, 81, 73, 0.1);
            border-color: #f85149;
            color: #f85149;
        }
        .btn-action.danger:hover {
            background: rgba(248, 81, 73, 0.2);
        }
        .step-display {
            background: rgba(31, 111, 235, 0.1);
            border: 1px solid #1f6feb;
            border-radius: 6px;
            padding: 12px;
            font-size: 12px;
            color: #79c0ff;
            margin-bottom: 20px;
        }
        .step-display strong {
            color: #e6edf3;
        }
        .canvas-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .swimlanes-container {
            flex: 0.6;
            overflow: auto;
            background: #0d1117;
            padding: 20px;
        }
        .swimlane {
            margin-bottom: 40px;
            border-left: 4px solid;
            padding-left: 20px;
            padding-bottom: 30px;
            border-bottom: 2px dashed #30363d;
            position: relative;
        }
        .swimlane:last-child {
            border-bottom: none;
        }
        .swimlane.manager {
            border-left-color: #93bda1;
        }
        .swimlane.dev1 {
            border-left-color: #8fb2c4;
        }
        .swimlane.dev2 {
            border-left-color: #c9a97e;
        }
        .swimlane-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #e6edf3;
        }
        .swimlane-title i {
            margin-right: 8px;
        }
        .action-box {
            display: inline-block;
            background: #1c2128;
            border: 3px solid;
            border-radius: 8px;
            padding: 16px 20px;
            margin-right: 16px;
            margin-bottom: 16px;
            min-width: 240px;
            animation: slideIn 0.4s ease-out;
            position: relative;
            transition: all 0.3s ease;
        }
        .action-box .step-number {
            position: absolute;
            top: -12px;
            left: 12px;
            background: #d29922;
            color: #1c2128;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            border: 2px solid #1c2128;
        }
        .action-box.completed .step-number {
            background: #3fb950;
            color: white;
        }
        .action-box.manager {
            border-color: #d29922;
            background: rgba(210, 153, 34, 0.08);
        }
        .action-box.manager.completed {
            border-color: #3fb950;
            background: rgba(79, 185, 80, 0.08);
            box-shadow: 0 0 12px rgba(79, 185, 80, 0.2);
        }
        .action-box.dev1 {
            border-color: #d29922;
            background: rgba(210, 153, 34, 0.08);
        }
        .action-box.dev1.completed {
            border-color: #3fb950;
            background: rgba(79, 185, 80, 0.08);
            box-shadow: 0 0 12px rgba(79, 185, 80, 0.2);
        }
        .action-box.dev2 {
            border-color: #d29922;
            background: rgba(210, 153, 34, 0.08);
        }
        .action-box.dev2.completed {
            border-color: #3fb950;
            background: rgba(79, 185, 80, 0.08);
            box-shadow: 0 0 12px rgba(79, 185, 80, 0.2);
        }

        .action-box.pending {
            opacity: 0.9;
            cursor: not-allowed;
        }
        .action-box.pending .step-number {
            background: #d29922;
            border-color: #d29922;
        }
        .action-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #e6edf3;
        }
        .action-desc {
            font-size: 11px;
            color: #8b949e;
            font-family: 'Courier New', monospace;
        }
        .action-icon {
            font-size: 20px;
            margin-bottom: 8px;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .terminal-section {
            flex: 0.4;
            background: #010409;
            border-top: 2px solid #30363d;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .terminal-header {
            padding: 18px 24px;
            border-bottom: 2px solid #30363d;
            font-size: 14px;
            font-weight: 700;
            color: #79c0ff;
            background: #0d1117;
            letter-spacing: 0.5px;
        }
        .terminal {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            line-height: 2.2;
            background: #0d1117;
            min-height: 0;
        }
        .terminal-line {
            margin-bottom: 12px;
            animation: slideIn 0.3s ease-out;
            letter-spacing: 0.3px;
        }
        .terminal-line.cmd {
            color: #79c0ff;
            font-weight: 600;
            background: rgba(121, 192, 255, 0.05);
            padding: 8px 12px;
            border-radius: 4px;
            border-left: 3px solid #79c0ff;
            padding-left: 16px;
        }
        .terminal-line.ok {
            color: #3fb950;
            font-weight: 500;
        }
        .terminal-line.err {
            color: #f85149;
            font-weight: 500;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d444d;
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1><i class="bi bi-diagram-3"></i> Git Simulator</h1>
        <p style="font-size: 12px; color: #8b949e; margin-top: 4px;">Flujo Colaborativo con Swimlanes</p>
    </div>
    <span class="header-badge"><i class="bi bi-play-circle"></i> Interactivo</span>
</div>

<div class="main-wrapper">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="step-display">
            Paso: <strong id="step-num">0</strong> de <strong id="step-total">12</strong>
        </div>

        <div class="sidebar-title">Acciones Disponibles</div>
        <div id="actions-list"></div>

        <div style="margin-top: 20px;">
            <button class="btn-action danger" onclick="resetAll()">
                <i class="bi bi-arrow-counterclockwise"></i> Reiniciar
            </button>
        </div>
    </div>

    <!-- CANVAS -->
    <div class="canvas-wrapper">
        <div class="swimlanes-container" id="swimlanes">
            <div class="swimlane manager">
                <div class="swimlane-title">
                    <i class="bi bi-person-check"></i> Tech Lead / Manager
                </div>
                <div id="manager-lane"></div>
            </div>

            <div class="swimlane dev1">
                <div class="swimlane-title">
                    <i class="bi bi-person"></i> Dev 1 (Alpha)
                </div>
                <div id="dev1-lane"></div>
            </div>

            <div class="swimlane dev2">
                <div class="swimlane-title">
                    <i class="bi bi-person"></i> Dev 2 (Beta)
                </div>
                <div id="dev2-lane"></div>
            </div>
        </div>

        <!-- TERMINAL -->
        <div class="terminal-section">
            <div class="terminal-header">
                <i class="bi bi-terminal"></i> Terminal de Comandos
            </div>
            <div class="terminal" id="terminal">
                <div class="terminal-line" style="color: #3fb950;">$ Git Simulator v1.0 - Ready</div>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================
// ESTADO GLOBAL
// ============================================
const state = {
    currentStep: 0,
    completedSteps: [],
    lanes: {
        manager: [],
        dev1: [],
        dev2: []
    }
};

const workflow = [
    {
        role: 'manager',
        title: 'Crear Proyecto',
        desc: 'Inicializar repositorio en GitHub',
        cmd: 'git init --bare project',
        icon: '📁',
        lane: 'manager-lane'
    },
    {
        role: 'manager',
        title: 'Agregar Arquitectura',
        desc: 'Documentación del proyecto y especificaciones',
        cmd: 'echo "architecture.md" > docs/',
        icon: '📄',
        lane: 'manager-lane'
    },
    {
        role: 'manager',
        title: 'Git Add',
        desc: 'Preparar archivos para commit',
        cmd: 'git add --all',
        icon: '📦',
        lane: 'manager-lane'
    },
    {
        role: 'manager',
        title: 'Commit Inicial',
        desc: 'Commit: "Docs de arquitectura y proyecto"',
        cmd: 'git commit -m "Initial: Architecture docs"',
        icon: '💾',
        lane: 'manager-lane'
    },
    {
        role: 'dev1',
        title: 'Git Clone',
        desc: 'Clonar repositorio a máquina local',
        cmd: 'git clone origin project',
        icon: '📥',
        lane: 'dev1-lane'
    },
    {
        role: 'dev1',
        title: 'Agregar Login',
        desc: 'Desarrollar funcionalidades de autenticación',
        cmd: 'echo "login.js" > src/auth/',
        icon: '🔐',
        lane: 'dev1-lane'
    },
    {
        role: 'dev1',
        title: 'Git Add',
        desc: 'Preparar cambios de login',
        cmd: 'git add --all',
        icon: '📦',
        lane: 'dev1-lane'
    },
    {
        role: 'dev1',
        title: 'Commit Login',
        desc: 'Commit: "Add Login Specs"',
        cmd: 'git commit -m "Add Login Specs"',
        icon: '💾',
        lane: 'dev1-lane'
    },
    {
        role: 'dev1',
        title: 'Git Push',
        desc: 'Enviar cambios a GitHub',
        cmd: 'git push origin feature/login',
        icon: '⬆️',
        lane: 'dev1-lane'
    },
    {
        role: 'manager',
        title: 'Revisar PR Dev1',
        desc: 'Revisar Pull Request de autenticación',
        cmd: 'gh pr review --approve',
        icon: '✅',
        lane: 'manager-lane'
    },
    {
        role: 'manager',
        title: 'Merge Dev1',
        desc: 'Mergear cambios a main',
        cmd: 'git merge feature/login',
        icon: '🔗',
        lane: 'manager-lane'
    },
    {
        role: 'manager',
        title: 'Broadcast PR',
        desc: 'Notificar al equipo sobre cambios',
        cmd: 'gh pr create --title "Update main"',
        icon: '📢',
        lane: 'manager-lane'
    },
    {
        role: 'dev2',
        title: 'Git Clone/Pull',
        desc: 'Obtener cambios actualizados del servidor',
        cmd: 'git pull origin main',
        icon: '📥',
        lane: 'dev2-lane'
    },
    {
        role: 'dev2',
        title: 'Agregar Carrito',
        desc: 'Desarrollar funcionalidades de carrito de compras',
        cmd: 'echo "cart.js" > src/shop/',
        icon: '🛒',
        lane: 'dev2-lane'
    },
    {
        role: 'dev2',
        title: 'Git Add',
        desc: 'Preparar cambios del carrito',
        cmd: 'git add --all',
        icon: '📦',
        lane: 'dev2-lane'
    },
    {
        role: 'dev2',
        title: 'Commit Carrito',
        desc: 'Commit: "Add Shopping Cart Specs"',
        cmd: 'git commit -m "Add Shopping Cart Specs"',
        icon: '💾',
        lane: 'dev2-lane'
    },
    {
        role: 'dev2',
        title: 'Git Push',
        desc: 'Enviar cambios a GitHub',
        cmd: 'git push origin feature/cart',
        icon: '⬆️',
        lane: 'dev2-lane'
    },
    {
        role: 'manager',
        title: 'Revisar PR Dev2',
        desc: 'Revisar Pull Request del carrito',
        cmd: 'gh pr review --approve',
        icon: '✅',
        lane: 'manager-lane'
    },
    {
        role: 'manager',
        title: 'Merge Dev2',
        desc: 'Mergear cambios de carrito a main',
        cmd: 'git merge feature/cart',
        icon: '🔗',
        lane: 'manager-lane'
    },
    {
        role: 'manager',
        title: 'Broadcast Final',
        desc: 'Notificar cambios finales al equipo',
        cmd: 'gh pr create --title "Final Update"',
        icon: '📢',
        lane: 'manager-lane'
    }
];

// ============================================
// INICIALIZACIÓN
// ============================================
function init() {
    renderActionButtons();
    updateStepDisplay();
    addTerminal('$ Git Simulator v1.0 iniciado', 'ok');
}

// ============================================
// RENDERIZAR ACCIONES
// ============================================
function renderActionButtons() {
    const container = document.getElementById('actions-list');
    container.innerHTML = '';

    workflow.forEach((step, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-action';
        btn.innerHTML = `
            <div style="font-weight: 600;">${step.icon} ${step.title}</div>
            <div style="font-size: 11px; color: #8b949e; margin-top: 4px;">${step.desc}</div>
        `;
        btn.onclick = () => executeStep(idx);
        btn.disabled = idx > state.currentStep;
        container.appendChild(btn);
    });

    renderPreviewSteps();
}

function renderPreviewSteps() {
    // Mostrar fichas preview de pasos disponibles (amarillo) y completados (verde)
    workflow.forEach((step, idx) => {
        const lane = document.getElementById(step.lane);
        const existingId = `preview-step-${idx}`;
        let previewBox = document.getElementById(existingId);

        // Si el paso está disponible (idx <= currentStep)
        if (idx <= state.currentStep) {
            // Si ya fue ejecutado, cambiar a verde
            if (state.completedSteps.includes(idx)) {
                if (previewBox) {
                    previewBox.classList.remove('pending');
                    previewBox.classList.add('completed');
                }
            }
            // Si está disponible pero no ejecutado, crear en amarillo
            else if (!previewBox) {
                const box = document.createElement('div');
                box.id = existingId;
                box.className = `action-box ${step.role} pending`;
                box.innerHTML = `
                    <div class="step-number">${idx + 1}</div>
                    <div class="action-icon">${step.icon}</div>
                    <div class="action-title">${step.title}</div>
                    <div class="action-desc" style="opacity: 0.7;">${step.cmd}</div>
                    <div style="font-size: 11px; color: #d29922; margin-top: 8px; font-weight: 600;">⏳ Pendiente</div>
                `;
                lane.appendChild(box);
            }
        }
    });
}

// ============================================
// EJECUTAR PASO
// ============================================
function executeStep(stepIndex) {
    const step = workflow[stepIndex];

    // Encontrar o crear la caja de acción
    const previewId = `preview-step-${stepIndex}`;
    let box = document.getElementById(previewId);

    if (box) {
        // Cambiar de pending (amarillo) a completed (verde)
        box.classList.remove('pending');
        box.classList.add('completed');
        // Actualizar contenido para que ya no diga "Pendiente"
        const descDiv = box.querySelector('.action-desc');
        if (descDiv.nextElementSibling) {
            box.removeChild(descDiv.nextElementSibling);
        }
    } else {
        // Si no existe preview, crear directamente como completado
        const lane = document.getElementById(step.lane);
        box = document.createElement('div');
        box.id = previewId;
        box.className = `action-box ${step.role} completed`;
        box.innerHTML = `
            <div class="step-number">${stepIndex + 1}</div>
            <div class="action-icon">${step.icon}</div>
            <div class="action-title">${step.title}</div>
            <div class="action-desc">${step.cmd}</div>
        `;
        lane.appendChild(box);
    }

    // Terminal
    addTerminal(`$ ${step.cmd}`, 'cmd');
    setTimeout(() => {
        addTerminal(`✓ ${step.title} completado`, 'ok');
    }, 300);

    // Actualizar estado
    state.currentStep = stepIndex + 1;
    state.completedSteps.push(stepIndex);

    // Scroll a lo último
    setTimeout(() => {
        document.getElementById('swimlanes').scrollLeft = document.getElementById('swimlanes').scrollWidth;
    }, 100);

    // Actualizar botones y preview
    renderActionButtons();
    updateStepDisplay();
}

// ============================================
// ACTUALIZAR DISPLAY
// ============================================
function updateStepDisplay() {
    document.getElementById('step-num').textContent = state.currentStep;
    document.getElementById('step-total').textContent = workflow.length;
}

// ============================================
// TERMINAL
// ============================================
function addTerminal(text, type = 'normal') {
    const terminal = document.getElementById('terminal');
    const line = document.createElement('div');
    line.className = `terminal-line ${type}`;

    if (type === 'cmd') {
        line.textContent = text;
    } else if (type === 'ok') {
        line.textContent = text;
    } else {
        line.textContent = text;
    }

    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;
}

// ============================================
// REINICIAR
// ============================================
function resetAll() {
    state.currentStep = 0;
    state.completedSteps = [];
    state.lanes = {
        manager: [],
        dev1: [],
        dev2: []
    };

    document.getElementById('manager-lane').innerHTML = '';
    document.getElementById('dev1-lane').innerHTML = '';
    document.getElementById('dev2-lane').innerHTML = '';

    document.getElementById('terminal').innerHTML = '<div class="terminal-line" style="color: #3fb950;">$ Git Simulator reiniciado</div>';

    renderActionButtons();
    updateStepDisplay();
}

// Iniciar
document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
